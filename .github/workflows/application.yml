name: Application

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: rustfmt
      - name: Install native and static-analysis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          python -m pip install semgrep==1.170.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify native prerequisites
        run: pkg-config --exists gio-2.0 gtk+-3.0 webkit2gtk-4.1
      - name: Full repository confidence gate
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-browser-failures
          path: apps/desktop/test-results
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Advisory coverage report
        continue-on-error: true
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-coverage
          path: coverage
          if-no-files-found: warn
